<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KI im Bildungswesen</title>
    <script>
      // Redirect to index with hash routing for GitHub Pages
      // Keep 1 segment for the repo name: /ki-guide-for-all/
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repo = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var route = l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/');
      if (route) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          repo + '/#/' + route.replace(/&/g, '~and~') +
          (l.search ? '?' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      } else {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          repo + '/'
        );
      }
    </script>
  </head>
  <body></body>
</html>
